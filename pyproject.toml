[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tra-sniper"
version = "0.9.0"
description = "Accessible human-in-the-loop Taiwan Railway booking workspace"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "marttrach" }]
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "mcp>=1.12,<2",
  "pillow>=12.3,<13",
  "python-multipart>=0.0.31,<1",
  "pytesseract>=0.3.13,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
autobook = [
  "playwright>=1.44,<2",
]
# Picture-code OCR that can ship inside the API image (ddddocr rides onnxruntime).
autobook-captcha = [
  "ddddocr>=1.5,<2",
]
# The self-trained CRNN, THSR-Sniper style: weights live in src/tra_sniper/_ocr
# and tensorflow rides in the image, so no host venv ever needs to exist.
# CPU-only wheel; the pinned version matches the trained keras 3 format.
autobook-keras = [
  "tensorflow==2.17.0",
  "numpy>=1.26,<2",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]
[project.scripts]
tra-sniper = "tra_sniper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tra_sniper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference/thsr-legacy"]
