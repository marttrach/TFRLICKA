name: Build and Push Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    # A hung build otherwise runs until GitHub's 6 hour ceiling. These images
    # take about a minute each; the browser one a few minutes at most.
    timeout-minutes: 40

    # Step `if:` can't read `secrets`, so expose it through env.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    # GITHUB_TOKEN publishes the GHCR packages.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tra-sniper
            context: .
            dockerfile: ./Dockerfile
            gha_cache: true
          - name: tra-sniper-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            gha_cache: true
          # Headed Chromium + noVNC sidecar. Built from the repo root because
          # it copies docker/start-browser.sh.
          #
          # gha_cache is off here on purpose. mode=max exports every layer,
          # including the multi-GB Playwright base, into the Actions cache,
          # which is slow, rate limited, and capped at 10 GB per repo. The only
          # layers we own are one apt install and one COPY, so caching buys
          # almost nothing while risking a build that never finishes.
          - name: tra-sniper-browser
            context: .
            dockerfile: ./Dockerfile.browser
            gha_cache: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is the fast pull path from the deployment network.
      # Skipped when the secret is absent, so forks still build to GHCR.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the tag list in the shell so no blank line reaches build-push-action.
      # GHCR rejects uppercase characters in image paths.
      - name: Compute tags
        id: tags
        env:
          IMAGE: ${{ matrix.name }}
          SHA: ${{ github.sha }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo 'list<<TAGS_EOF'
            echo "${REGISTRY}/${owner}/${IMAGE}:latest"
            echo "${REGISTRY}/${owner}/${IMAGE}:${SHA}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/${IMAGE}:latest"
              echo "docker.io/${DOCKERHUB_USERNAME}/${IMAGE}:${SHA}"
            fi
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Scoped per image so the two cached builds stop evicting each other.
          cache-from: ${{ matrix.gha_cache && format('type=gha,scope={0}', matrix.name) || '' }}
          cache-to: ${{ matrix.gha_cache && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}

  # Redeploy only after every image is pushed, so Portainer never pulls a stale :latest.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - name: Trigger Portainer stack webhook
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: curl -fsS -X POST --max-time 60 "$PORTAINER_WEBHOOK_URL"
