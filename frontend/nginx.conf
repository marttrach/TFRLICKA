events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 80;
        server_name _;
        client_max_body_size 9m;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            proxy_pass http://tra-sniper-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Docker's embedded DNS. Required because the proxy_pass directives
        # below contain variables, which makes nginx resolve the upstream at
        # request time instead of at startup. Resolving late is what we want
        # here: the dashboard must still start when the browser sidecar is down.
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Remote booking hand-off. Every request is checked against the API's
        # one-time session token first; noVNC is never reachable without it.
        location = /booking-session-auth {
            internal;
            proxy_pass http://tra-sniper-api:8000/booking-session/$booking_token/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location ~ ^/booking-session/(?<booking_token>[A-Za-z0-9_-]+)/(?<novnc_path>.*)$ {
            auth_request /booking-session-auth;
            proxy_pass http://tra-sniper-browser:6080/$novnc_path$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
